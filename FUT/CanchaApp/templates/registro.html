{% extends "base.html" %}

{% block titulo %}Registro - CanchaApp{% endblock %}

{% block contenido %}
<section class="seccion-gris">
    <div class="contenedor">
        <div class="tarjeta-formulario">
            <h1>Crear una cuenta</h1>
            <p class="texto-ayuda">
                Regístrate como jugador o como administrador de canchas sintéticas.
            </p>

            <!-- method="POST" envía los datos de forma segura en el cuerpo de la petición -->
            <form method="POST" action="/registro">
                <div class="campo-formulario">
                    <label for="nombre">Nombre completo</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ej: Laura Gómez"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="correo">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="Ej: laura@correo.com"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="contrasena">Contraseña</label>
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Mínimo 6 caracteres"
                        minlength="6"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="tipo_usuario">Tipo de usuario</label>
                    <select id="tipo_usuario" name="tipo_usuario" required>
                        <option value="jugador">Jugador (reservar canchas, crear equipo y buscar rivales)</option>
                        <option value="administrador">Administrador de cancha (publicar canchas y gestionar reservas)</option>
                    </select>
                </div>

                <button type="submit" class="boton boton-principal boton-ancho">
                    Registrarme
                </button>
            </form>

            <p class="enlace-inferior">
                ¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
